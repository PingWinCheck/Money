version: "3.8"

services:
  app:
    container_name: my_app
    build: .
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis-base
      REDIS_PORT: 6379
      RMQ_HOST: rmq
      RMQ_PORT: 5672
    ports:
      - "8001:8000"
    volumes:
      - ./:/app
    depends_on:
      - db
      - redis-base
      - rmq
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: always

  db:
    container_name: my_db
    image: postgres
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - .postgres:/var/lib/postgresql/data
    ports:
      - ${DB_PORT}:5432
    restart: always

  redis-base:
    container_name: redis-base
    image: redis
    ports:
      - ${REDIS_PORT}:6379
    restart: always

  rmq:
    container_name: RabbitMQ
    image: rabbitmq:4.0.2-management-alpine
    ports:
      - ${RMQ_PORT}:5672
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASS}
    restart: always